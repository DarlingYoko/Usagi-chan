name: Test

on:
  push:
    branches: [ "universal" ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: Portainer

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: 3.12

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests
      run: pytest
