services:
    usagi-chan:
        build: .
#        volumes:
#          - .:/Usagi
        env_file:
            - stack.env
        depends_on:
          - postgres

    postgres:
        image: pgvector/pgvector:pg17
        # Only the DB credentials, interpolated from the stack env (Portainer,
        # or `docker compose --env-file stack.env`) — env_file: stack.env would
        # also hand the Discord token, Fernet key and VPN creds to Postgres.
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
          - "127.0.0.1:5432:5432"
        volumes:
            - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
