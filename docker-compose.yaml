version: '3'
services:
    usagi-chan:
        build: .
        # volumes:
        #     - .:/Usagi
        ports:
            - "8080:8080"
        env_file:
            - stack.env

    postgres:
        image: pgvector/pgvector:pg17
        env_file:
            - stack.env
        volumes:
            - pg_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"

volumes:
  pg_data:
