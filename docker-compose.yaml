services:
    usagi-chan:
        build: .
#        volumes:
#          - .:/Usagi
        env_file:
            - stack.env
        depends_on:
          - postgres

    postgres:
        image: pgvector/pgvector:pg17
        env_file:
            - stack.env
        ports:
          - "127.0.0.1:5432:5432"
        volumes:
            - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
