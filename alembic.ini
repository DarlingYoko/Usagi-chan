# Alembic CLI config. The bot itself runs `upgrade head` on first connect
# (usagiBot/db/migrate.py), so the CLI is for authoring and maintenance:
#
#   alembic revision --autogenerate -m "add foo to bar"   # then review the file!
#   alembic upgrade head | alembic downgrade -1 | alembic current
#
# The database URL comes from the POSTGRES_* env vars (usagiBot/db/base.py);
# BOT_OWNER/BOT_ID must be set too because usagiBot.env parses them on import.
# In docker: docker compose exec usagi-chan alembic <command>

[alembic]
script_location = %(here)s/usagiBot/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
